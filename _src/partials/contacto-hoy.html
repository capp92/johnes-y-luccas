<section class="contacto-hoy" aria-labelledby="contacto-hoy-title" style="--ch-h:{{alto|337px}};--ch-op:{{opacidad|.25}}">
  <img class="contacto-hoy__bg" src="{{root}}assets/img/contacto-hoy-equipo-de-negocios.jpg" alt="" width="2560" height="1706" loading="lazy">
  <div class="stage contacto-hoy__stage">
    <h2 class="contacto-hoy__title at" id="contacto-hoy-title" style="--x:0px;--y:{{titulo-y|25px}};--w:494px">Contáctenos hoy</h2>
    <p class="contacto-hoy__sub at" style="--x:0px;--y:103px;--w:401px">{{subtitulo}}</p>
    <div class="contacto-hoy__tel at" style="--x:0px;--y:{{tel-y|184px}};--w:198px">
      <p>Teléfonos</p>
      <p><a href="tel:+56232205850">+(56) 2 3220 5850</a></p>
      <p><a href="tel:+56232205857">+(56) 2 3220 5857</a></p>
    </div>
    <div class="contacto-hoy__form at" style="--x:{{form-x|492px}};--y:32px;--w:485px">
      {{> form-contacto form-class="form--oscuro" origen="{{origen}}" exito="¡Gracias! Mensaje enviado." redirect="" mensaje="Mensaje *" mensaje-required=" required"}}
    </div>
  </div>
</section>
