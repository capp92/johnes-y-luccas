<dialog class="contact-dialog" id="contacto-dialog" aria-labelledby="contacto-dialog-title">
  <div class="contact-dialog__aside" aria-hidden="true">
    <img src="{{root}}assets/img/servicios/banner-contabilidad.jpg" alt="" width="1740" height="1161" loading="lazy">
    <p>Estoril 200, Of. 526<br>Santiago, Chile</p>
  </div>
  <div class="contact-dialog__main">
    <button class="contact-dialog__close" type="button" data-close-dialog aria-label="Cerrar"><svg viewBox="25.975 25.975 148.05 148.05" aria-hidden="true"><path d="M172.9 167.6L105.3 100l67.6-67.6c1.5-1.5 1.5-3.8 0-5.3s-3.8-1.5-5.3 0L100 94.7 32.4 27.1c-1.5-1.5-3.8-1.5-5.3 0s-1.5 3.8 0 5.3L94.7 100l-67.6 67.6c-1.5 1.5-1.5 3.8 0 5.3s3.8 1.5 5.3 0l67.6-67.6 67.6 67.6c1.5 1.5 3.8 1.5 5.3 0s1.5-3.8 0-5.3z"/></svg></button>
    <h2 class="contact-dialog__title" id="contacto-dialog-title">CONTÁCTANOS</h2>
    <form class="form" action="#" method="post" data-contact-form data-origin="Popup {{origen}}" data-success="¡Gracias! Mensaje enviado." data-redirect="gracias-contacto-servicios/">
      <input class="form__field" type="text" name="nombre" placeholder="Nombre *" aria-label="Nombre" autocomplete="name" required autofocus>
      <input class="form__field" type="email" name="email" placeholder="E-mail *" aria-label="E-mail" autocomplete="email" required>
      <textarea class="form__field" name="mensaje" placeholder="Mensaje *" aria-label="Mensaje" required></textarea>
      <div class="form__footer">
        <p class="form__status" role="status" aria-live="polite"></p>
        <button class="form__submit" type="submit">ENVIAR</button>
      </div>
    </form>
    <ul class="contact-dialog__social" aria-label="Redes sociales (sin enlace en el sitio original)">
      <li><img src="{{root}}assets/img/social-google-plus.png" alt="Google+" width="30" height="30" loading="lazy"></li>
      <li><img src="{{root}}assets/img/social-youtube.png" alt="YouTube" width="30" height="30" loading="lazy"></li>
      <li><img src="{{root}}assets/img/social-facebook.png" alt="Facebook" width="30" height="30" loading="lazy"></li>
      <li><img src="{{root}}assets/img/social-linkedin.png" alt="LinkedIn" width="30" height="30" loading="lazy"></li>
    </ul>
    <p class="contact-dialog__foot"><a href="mailto:contacto@johnesyluccas.cl">contacto@johnesyluccas.cl</a>&nbsp; | &nbsp;Tel: +56 2 3220 5850</p>
  </div>
</dialog>
